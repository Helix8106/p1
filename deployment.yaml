# ==========================================
# 1. MYSQL DEPLOYMENT
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.0

          env:
            - name: MYSQL_ROOT_PASSWORD
              value: root

            - name: MYSQL_DATABASE
              value: studentdb

          ports:
            - containerPort: 3306


---
# ==========================================
# 2. MYSQL SERVICE
# ==========================================

apiVersion: v1
kind: Service
metadata:
  name: mysql-service

spec:
  selector:
    app: mysql

  ports:
    - port: 3306
      targetPort: 3306


---
# ==========================================
# 3. FLASK APPLICATION DEPLOYMENT
# ==========================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-app

  template:
    metadata:
      labels:
        app: student-app

    spec:
      containers:
        - name: student-app
          image: aryann8/student-k8s:2.0

          ports:
            - containerPort: 5000


---
# ==========================================
# 4. FLASK APPLICATION SERVICE
# ==========================================

apiVersion: v1
kind: Service
metadata:
  name: student-app-service

spec:
  type: NodePort

  selector:
    app: student-app

  ports:
    - port: 5000
      targetPort: 5000